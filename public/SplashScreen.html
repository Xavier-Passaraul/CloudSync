<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CloudSync</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:#06101a;overflow:hidden;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;}
  #sp{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;background:#06101a;}
  .noise-bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 42%,#0d2a3a 0%,transparent 70%);opacity:0;transition:opacity 1.4s ease;}
  .corner{position:absolute;width:20px;height:20px;opacity:0;transition:opacity 0.8s ease;}
  .corner.tl{top:24px;left:24px;border-top:1px solid #4db8c8;border-left:1px solid #4db8c8;}
  .corner.tr{top:24px;right:24px;border-top:1px solid #4db8c8;border-right:1px solid #4db8c8;}
  .corner.bl{bottom:24px;left:24px;border-bottom:1px solid #4db8c8;border-left:1px solid #4db8c8;}
  .corner.br{bottom:24px;right:24px;border-bottom:1px solid #4db8c8;border-right:1px solid #4db8c8;}
  .main{display:flex;flex-direction:column;align-items:center;gap:0;z-index:3;}
  .outer-box{width:clamp(120px,28vmin,180px);height:clamp(120px,28vmin,180px);border-radius:clamp(24px,6vmin,40px);background:#08141e;border:1px solid #0d2233;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(0.78);transition:opacity 0.8s cubic-bezier(.34,1.4,.64,1),transform 0.8s cubic-bezier(.34,1.4,.64,1);position:relative;}
  .outer-box::before{content:'';position:absolute;inset:-1px;border-radius:inherit;background:linear-gradient(135deg,#1a4a5a33,transparent 50%,#4db8c811);pointer-events:none;border-radius:clamp(25px,6.2vmin,41px);}
  .inner-box{width:clamp(92px,21vmin,138px);height:clamp(92px,21vmin,138px);border-radius:clamp(16px,4vmin,26px);background:#071219;border:1px solid #122030;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(0.78);transition:opacity 0.7s cubic-bezier(.34,1.35,.64,1),transform 0.7s cubic-bezier(.34,1.35,.64,1);}
  .logo-svg{opacity:0;transform:scale(0.65) translateY(4px);transition:opacity 0.8s cubic-bezier(.34,1.2,.64,1),transform 0.8s cubic-bezier(.34,1.2,.64,1);}
  .brand{margin-top:clamp(24px,5vmin,40px);display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1vmin,10px);opacity:0;transform:translateY(20px);transition:opacity 0.9s ease,transform 0.9s cubic-bezier(.22,1,.36,1);}
  .brand-name{font-size:clamp(16px,4vmin,26px);font-weight:200;letter-spacing:clamp(4px,1.5vmin,8px);color:#c8dde6;text-transform:uppercase;}
  .brand-name b{font-weight:500;color:#4db8c8;}
  .brand-tag{font-size:clamp(7px,1.5vmin,10px);letter-spacing:clamp(3px,1vmin,5px);color:#1e4a5a;text-transform:uppercase;}
  .progress-wrap{margin-top:clamp(28px,6vmin,48px);width:80px;height:1px;background:#0d2233;border-radius:1px;opacity:0;transition:opacity 0.5s ease;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#1a6a7a,#4db8c8);border-radius:1px;transition:width 1.6s cubic-bezier(.4,0,.2,1);}
  .on{opacity:1!important;}
  .show{opacity:1!important;transform:scale(1)!important;}
  .show-y{opacity:1!important;transform:translateY(0)!important;}
</style>
</head>
<body>
<div id="sp">
  <div class="noise-bg" id="nbg"></div>
  <div class="corner tl" id="c1"></div><div class="corner tr" id="c2"></div>
  <div class="corner bl" id="c3"></div><div class="corner br" id="c4"></div>
  <div class="main">
    <div class="outer-box" id="outer">
      <div class="inner-box" id="inner">
        <svg class="logo-svg" id="logo" viewBox="0 0 82 82" style="width:clamp(60px,14vmin,90px);height:clamp(60px,14vmin,90px);">
          <defs>
            <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="110%">
              <stop offset="0%" stop-color="#5ecfdf"/><stop offset="100%" stop-color="#1a6a7a"/>
            </linearGradient>
          </defs>
          <path d="M12,50 Q10,62 20,64 L62,64 Q72,64 72,54 Q72,44 63,43 Q65,34 58,27 Q50,18 40,22 Q34,12 24,10 Q12,6 6,18 Q0,30 8,40 Q3,42 12,50 Z"
            fill="none" stroke="url(#pg)" stroke-width="1.4"/>
          <text x="41" y="54" text-anchor="middle"
            font-family="-apple-system,'Helvetica Neue',Arial,sans-serif"
            font-size="30" font-weight="200" letter-spacing="-1" fill="url(#pg)">S</text>
        </svg>
      </div>
    </div>
    <div class="brand" id="brand">
      <div class="brand-name">Cloud<b>Sync</b></div>
      <div class="brand-tag">Sync · Store · Secure</div>
    </div>
    <div class="progress-wrap" id="pw"><div class="progress-fill" id="pf"></div></div>
  </div>
</div>
<script>
function run(){
  ['nbg','outer','inner','logo','brand','pw'].forEach(id=>{
    const el=document.getElementById(id);
    el.classList.remove('on','show','show-y');
    el.style.opacity='';
  });
  ['c1','c2','c3','c4'].forEach(id=>document.getElementById(id).classList.remove('on'));
  const pf=document.getElementById('pf');
  pf.style.transition='none'; pf.style.width='0%';

  setTimeout(()=>document.getElementById('nbg').classList.add('on'),200);
  setTimeout(()=>['c1','c2','c3','c4'].forEach(id=>document.getElementById(id).classList.add('on')),500);
  setTimeout(()=>document.getElementById('outer').classList.add('show'),700);
  setTimeout(()=>document.getElementById('inner').classList.add('show'),1300);
  setTimeout(()=>document.getElementById('logo').classList.add('show'),1950);
  setTimeout(()=>{const b=document.getElementById('brand');b.style.opacity='1';b.style.transform='translateY(0)';},2800);
  setTimeout(()=>{
    document.getElementById('pw').style.opacity='1';
    setTimeout(()=>{pf.style.transition='width 1.6s cubic-bezier(.4,0,.2,1)';pf.style.width='100%';},80);
  },3500);
}
run();
</script>
</body>
</html>
